services:
  postgres:
    image: postgres:17
    container_name: shortxurl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortxurl
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: shortxurl
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: